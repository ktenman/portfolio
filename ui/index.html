<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
  <link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
  <meta content="yes" name="apple-mobile-web-app-capable"/>
  <meta content="yes" name="mobile-web-app-capable"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Portfolio</title>

  <script>
    try {
      const theme = localStorage.getItem('portfolio_theme')
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
    } catch {}
  </script>

  <!-- Initial loading styles -->
  <style>
    html {
      color-scheme: light dark;
      background-color: light-dark(#fcfaf6, #191512);
    }
    html[data-theme='light'] {
      color-scheme: light;
    }
    html[data-theme='dark'] {
      color-scheme: dark;
    }
    body {
      margin: 0;
    }
    .initial-loader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: light-dark(#fcfaf6, #191512);
    }
    .initial-spinner {
      width: 3rem;
      height: 3rem;
      border: 0.25rem solid light-dark(#e2dfda, #342f2b);
      border-top-color: light-dark(#8d621f, #e1b671);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="initial-loader">
    <div class="initial-spinner"></div>
  </div>
</div>
<script src="./main.ts" type="module"></script>
</body>
</html>
