services:
  postgres-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U postgres' ]
      interval: 1s
      timeout: 1s
      retries: 5

  redis-dev:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 1s
      timeout: 1s
      retries: 5

  seaweedfs-dev:
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    ports:
      - '9000:9000'
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: mini -dir=/data -s3.port=9000 -s3.autoCreateBucket=false -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 -webdav=false -master.telemetry=false
    volumes:
      - seaweedfs_data_dev:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q "HTTP/1.1 403"' ]
      interval: 5s
      timeout: 5s
      retries: 5

  cloudflare-bypass-proxy:
    container_name: cloudflare-bypass-proxy
    platform: linux/amd64
    build:
      context: ./cloudflare-bypass-proxy
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - '3000:3000'
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD-SHELL', 'node -e "require(\"http\").get(\"http://localhost:3000/health\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))"' ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    environment:
      NODE_ENV: production

volumes:
  postgres_data_dev:
  redis_data_dev:
  seaweedfs_data_dev:
