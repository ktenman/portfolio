[project]
name = "radio-worker"
version = "0.1.0"
description = "Records Kuku's stream and transcribes it live with the TalTech Whisper model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-edge-litert==2.3.0",
    "faster-whisper==1.2.1",
    "numpy==2.5.4",
]

[project.scripts]
radio-worker = "radio_worker.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
