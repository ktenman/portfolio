name: Deploy Pipeline

permissions:
  contents: read
  deployments: write

on:
  workflow_call:
    secrets:
      FOV_SSH_PRIVATE_KEY:
        required: true
      POSTGRES_USER:
        required: true
      POSTGRES_PASSWORD:
        required: true
      GOOGLE_CLIENT_ID:
        required: true
      GOOGLE_CLIENT_SECRET:
        required: true
      HEALTHCHECK_URL:
        required: true
      ALLOWED_EMAILS:
        required: true
      TELEGRAM_BOT_TOKEN:
        required: true
      GOOGLE_VISION_API_KEY:
        required: true
      MINIO_ROOT_USER:
        required: true
      MINIO_ROOT_PASSWORD:
        required: true
      MINIO_BUCKET_NAME:
        required: false
      OPENROUTER_API_KEY:
        required: true
      TRADING212_API_KEY_ID:
        required: true
      TRADING212_API_KEY_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to fov.ee'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: 🚀 Deploy to fov.ee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.FOV_SSH_PRIVATE_KEY }}
      - name: Add fov.ee SSH fingerprint to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H fov.ee >> ~/.ssh/known_hosts
      - name: Create .env file
        run: |
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" > .env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "HEALTHCHECK_URL=${{ secrets.HEALTHCHECK_URL }}" >> .env
          echo "ALLOWED_EMAILS=${{ secrets.ALLOWED_EMAILS }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "GOOGLE_VISION_API_KEY=${{ secrets.GOOGLE_VISION_API_KEY }}" >> .env
          echo "MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}" >> .env
          echo "MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}" >> .env
          echo "MINIO_BUCKET_NAME=${{ secrets.MINIO_BUCKET_NAME || 'portfolio-logos' }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "TRADING212_API_KEY_ID=${{ secrets.TRADING212_API_KEY_ID }}" >> .env
          echo "TRADING212_API_KEY_SECRET=${{ secrets.TRADING212_API_KEY_SECRET }}" >> .env
          echo "BUILD_HASH=$(git rev-parse --short HEAD)" >> .env
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env
      - name: Copy files to server
        run: |
          scp .env docker-compose.yml Caddyfile healthcheck.sh githubuser@fov.ee:~/
      - name: Deploy with Docker Compose
        run: |
          ssh githubuser@fov.ee "\
            set -eu; \
            docker volume inspect portfolio_seaweedfs_data >/dev/null; \
            docker run --rm --network none --read-only --mount type=volume,src=portfolio_seaweedfs_data,dst=/data,readonly --entrypoint sh docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 -c 'test -f /data/.portfolio-storage-ready'; \
            echo 'Pulling latest images (with retry)...' && \
            for i in 1 2 3; do \
              docker compose pull && break || { [ \"\$i\" -lt 3 ] || exit 1; echo \"Pull attempt \$i failed, retrying in 15s...\"; sleep 15; }; \
            done && \
            echo 'Starting containers...' && \
            for i in 1 2 3; do \
              docker compose up -d && break; \
              if [ \"\$i\" -eq 3 ]; then echo 'Failed to start containers after 3 attempts'; exit 1; fi; \
              echo \"Start attempt \$i failed, retrying in 10s...\"; \
              sleep 10; \
            done && \
            docker compose up -d --no-deps --force-recreate app healthcheck && \
            echo 'Waiting for all services to become healthy...' && \
            OK=0 && \
            for i in \$(seq 1 40); do \
              HEALTHY=\$(docker ps --filter 'health=healthy' --format '{{.Names}}' | wc -l); \
              RUNNING=\$(docker ps --filter 'status=running' --format '{{.Names}}' | wc -l); \
              echo \"Health check \$i/40: \$HEALTHY healthy, \$RUNNING running\"; \
              if [ \"\$HEALTHY\" -ge 8 ] && [ \"\$RUNNING\" -ge 9 ]; then OK=1; echo 'All services healthy and running!'; break; fi; \
              sleep 10; \
            done && \
            if [ \"\$OK\" -ne 1 ]; then echo 'Services failed to become healthy after 40 checks'; docker ps; exit 1; fi && \
            docker ps --format 'table {{.Names}}\t{{.Status}}'"
      - name: Cleanup on runner
        run: rm .env
