name: Visual Dump

on:
  push:
    branches: [claude/portfolio-rebalancing-markers-kdxs9f]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Record failing baselines
        run: npx playwright test ui/tests/visual/routes.spec.ts ui/tests/visual/states.spec.ts -g "route etf-breakdown|modal logo-replacement" --update-snapshots
      - name: Verify recorded baselines
        run: npx playwright test ui/tests/visual/routes.spec.ts ui/tests/visual/states.spec.ts -g "route etf-breakdown|modal logo-replacement"
      - name: Push baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/superpowers/baseline
          git status --short
          md5sum docs/superpowers/baseline/route-etf-breakdown-tablet.png docs/superpowers/baseline/modal-logo-replacement-*.png
          git commit -m "Record visual baselines from CI" || exit 0
          git push
