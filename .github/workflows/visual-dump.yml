name: Visual Dump

on:
  push:
    branches: [claude/portfolio-rebalancing-markers-kdxs9f]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: First run
        run: npx playwright test || true
      - name: Second run of the failing tests
        run: npx playwright test ui/tests/visual/routes.spec.ts ui/tests/visual/states.spec.ts -g "route etf-breakdown|modal logo-replacement" --output second-results || true
      - name: Compare runs
        run: find test-results second-results -name '*actual.png' -exec md5sum {} \; | sort -k2
      - uses: actions/upload-artifact@v7
        with:
          name: visual-dump
          path: |
            test-results/
            second-results/
          retention-days: 1

  dump:
    needs: visual
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - routes-route-etf-breakdown-tablet
          - states-modals-modal-logo-replacement-mobile
          - states-modals-modal-logo-replacement-desktop
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: visual-dump
      - name: Print files
        run: |
          ls -la test-results/${{ matrix.dir }} second-results/${{ matrix.dir }} || true
          cat test-results/${{ matrix.dir }}/error-context.md || true
          for f in $(find test-results/${{ matrix.dir }} -name '*-diff.png' -o -name '*-actual.png' | sort); do
            echo "=== BEGIN $f $(stat -c %s "$f")"
            base64 "$f"
            echo "=== END $f"
          done
