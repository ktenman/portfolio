global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: portfolio-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9090]
