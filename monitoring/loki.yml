auth_enabled: false
server:
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 336h
compactor:
  retention_enabled: true
  delete_request_store: filesystem
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: false
query_range:
  results_cache:
    cache:
      embedded_cache:
        max_size_mb: 16
analytics:
  reporting_enabled: false
