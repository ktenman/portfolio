x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    logging: *logging
    container_name: postgres
    image: postgres:17-alpine
    command: >-
      postgres
      -c shared_preload_libraries=pg_stat_statements,auto_explain
      -c log_min_duration_statement=500ms
      -c auto_explain.log_min_duration=1s
      -c auto_explain.log_analyze=on
      -c auto_explain.log_timing=off
      -c logging_collector=on
      -c log_filename=postgresql-%a.log
      -c log_rotation_age=1d
      -c log_truncate_on_rotation=on
      -c log_lock_waits=on
      -c log_temp_files=0
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d portfolio" ]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
      start_interval: 3s
    restart: always

  redis:
    logging: *logging
    container_name: redis
    image: redis:8-alpine
    command: redis-server --maxmemory 768mb --maxmemory-policy allkeys-lru --save 3600 1 --stop-writes-on-bgsave-error no
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 1s
      retries: 5
    restart: always
    mem_limit: 1024m

  seaweedfs:
    logging: *logging
    container_name: seaweedfs
    image: docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: mini -dir=/data -s3.port=9000 -s3.autoCreateBucket=false -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 -webdav=false -master.telemetry=false
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'wget -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q "HTTP/1.1 403"' ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    logging: *logging
    container_name: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfolio
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: default
      MANAGEMENT_SERVER_PORT: 9090
      SPRING_FLYWAY_ENABLED: "true"
      MONITORING_POSTGRES_PASSWORD: ${MONITORING_POSTGRES_PASSWORD:-}
      SPRINGDOC_APIDOCS_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_ENABLED: true
      BUILD_HASH: ${BUILD_HASH:-local}
      BUILD_TIME: ${BUILD_TIME:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://seaweedfs:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-portfolio-logos}
      TRADING212_ENABLED: true
      CLOUDFLARE_BYPASS_PROXY_URL: http://cloudflare-bypass-proxy:3000
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      TRADING212_API_KEY_ID: ${TRADING212_API_KEY_ID}
      TRADING212_API_KEY_SECRET: ${TRADING212_API_KEY_SECRET}
    image: ktenman/portfolio-be:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      cloudflare-bypass-proxy:
        condition: service_healthy
    volumes:
      - radio_recordings:/recordings
    restart: always
    mem_limit: 2048m
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9090/actuator/health || exit 1" ]
      interval: 8s
      timeout: 2s
      retries: 15
      start_period: 60s

  frontend:
    logging: *logging
    container_name: frontend
    image: ktenman/portfolio-fe:latest
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1" ]
      interval: 3s
      timeout: 1s
      retries: 5

  auth:
    logging: *logging
    container_name: auth
    image: ktenman/auth:latest
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      ALLOWED_LOGINS: "ktenman"
      REDIRECT_URI: "https://fov.ee"
      SPRING_REDIS_HOST: redis
      SERVER_PORT: 8083
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1" ]
      interval: 6s
      timeout: 2s
      retries: 18
      start_period: 40s

  app:
    logging: *logging
    container_name: app
    image: caddy:2.10-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /srv/torrents:/srv/torrents:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/healthz" ]
      interval: 12s
      timeout: 3s
      retries: 5

  cloudflare-bypass-proxy:
    logging: *logging
    container_name: cloudflare-bypass-proxy
    platform: linux/amd64
    image: ktenman/cloudflare-bypass-proxy:latest
    restart: always
    healthcheck:
      test: [ 'CMD-SHELL', 'node -e "require(\"http\").get(\"http://localhost:3000/health\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))"' ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    environment:
      NODE_ENV: production

  radio-worker: &radio-worker
    logging: *logging
    container_name: radio-worker
    image: ktenman/radio-worker:latest
    profiles: [radio]
    command: ["planned"]
    restart: unless-stopped
    stop_grace_period: 5m
    cpus: 1.5
    cpu_shares: 256
    mem_limit: 1.2g
    memswap_limit: 2.4g
    oom_score_adj: 1000
    networks:
      - radio
    volumes:
      - radio_recordings:/recordings

  radio-whisper:
    <<: *radio-worker
    container_name: radio-whisper
    image: ktenman/radio-whisper:latest
    profiles: [whisper]
    volumes:
      - radio_model:/model
      - radio_recordings:/recordings

  radio-bridge:
    logging: *logging
    container_name: radio-bridge
    image: jrottenberg/ffmpeg:8-alpine@sha256:3ab1c371ad3e734e7a31a3219e6a75120f1106c776b291db1bfc2d20158cd73e
    profiles: [radio]
    user: "1000:1000"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /recordings/.aripaev &&
        exec ffmpeg -nostdin -loglevel warning
        -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 30
        -rw_timeout 15000000
        -i https://www.aripaev.ee/raadio/stream.mp3
        -map 0:a:0 -c:a copy
        -output_ts_offset $$(( $$(date +%s) % 95443 ))
        -f hls -hls_time 6 -hls_list_size 600
        -hls_flags delete_segments+omit_endlist
        -hls_segment_filename /recordings/.aripaev/seg_%05d.ts
        /recordings/.aripaev/stream.m3u8
    restart: unless-stopped
    cpus: 0.1
    mem_limit: 64m
    networks:
      - radio
    volumes:
      - radio_recordings:/recordings

  radio-worker-aripaev:
    <<: *radio-worker
    container_name: radio-worker-aripaev
    command: ["planned", "--station", "ARIPAEV", "--source", "/recordings/.aripaev/stream.m3u8"]

  healthcheck:
    logging: *logging
    container_name: healthcheck
    image: alpine:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      auth:
        condition: service_healthy
      app:
        condition: service_healthy
      cloudflare-bypass-proxy:
        condition: service_healthy
    environment:
      - HEALTHCHECK_URL=${HEALTHCHECK_URL}
    volumes:
      - ./healthcheck.sh:/usr/local/bin/healthcheck.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: /usr/local/bin/healthcheck.sh
    restart: always

  alertmanager:
    logging: *logging
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    profiles: [monitoring]
    user: "0:0"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.external-url=https://fov.ee/alertmanager/
      - --web.route-prefix=/
      - --storage.path=/alertmanager
      - --data.retention=4320h
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/run/monitoring-secrets:ro
      - alertmanager_data:/alertmanager
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  prometheus:
    logging: *logging
    image: prom/prometheus:v3.13.3@sha256:6976aa8a60fec930796ce5772b8d12da7a318a5daa8d40d69c5c7819a05eeed7
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=https://fov.ee/prometheus/
      - --web.route-prefix=/
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --rules.alert.resend-delay=15s
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  node-exporter:
    logging: *logging
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    profiles: [monitoring]
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
      - --no-collector.netdev
      - --no-collector.netstat
      - --no-collector.sockstat
      - --no-collector.arp
      - --no-collector.netclass
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    read_only: true
    cap_drop: [ALL]
    mem_limit: 48m
    restart: unless-stopped

  cadvisor:
    logging: *logging
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    profiles: [monitoring]
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --enable_metrics=cpu,memory
    environment:
      GOMEMLIMIT: 100MiB
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    mem_limit: 128m
    restart: unless-stopped

  redis-exporter:
    logging: *logging
    image: oliver006/redis_exporter:v1.96.0@sha256:3d57b9eb142a62ffc600063606a41cd471cd53d81bed10be5b56b3a8918f2c26
    profiles: [monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379
    read_only: true
    cap_drop: [ALL]
    mem_limit: 32m
    restart: unless-stopped

  postgres-exporter:
    logging: *logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres:5432/portfolio?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_POSTGRES_PASSWORD:-}
      GOMEMLIMIT: 48MiB
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    restart: unless-stopped

  grafana:
    logging: *logging
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [monitoring]
    environment:
      GF_SERVER_ROOT_URL: https://fov.ee/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_UNIFIED_ALERTING_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GOMEMLIMIT: 180MiB
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 320m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 60s
  socket-proxy:
    logging: *logging
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    profiles: [monitoring]
    environment:
      CONTAINERS: '1'
      NETWORKS: '1'
      POST: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs: [/run, /tmp]
    mem_limit: 32m
    restart: unless-stopped

  loki:
    logging: *logging
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    profiles: [monitoring]
    command: [-config.file=/etc/loki/loki.yml]
    environment:
      GOMEMLIMIT: 180MiB
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    read_only: true
    cap_drop: [ALL]
    mem_limit: 256m
    restart: unless-stopped

  alloy:
    logging: *logging
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    profiles: [monitoring]
    user: '473:473'
    command: [run, --storage.path=/var/lib/alloy/data, --disable-reporting, /etc/alloy/config.alloy]
    environment:
      GOMEMLIMIT: 100MiB
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  seaweedfs_data:
    name: portfolio_seaweedfs_data
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  alloy_data:
  radio_model:
  radio_recordings:

networks:
  radio:
